# UniversalModSync compatibility core.
# Forge/Fabric JARs placed here are inspected, not executed by Paper.
# A compatible Paper adapter is required to implement each mod's behavior.
mods:
  directory: "mods"

http:
  enabled: true
  bind-address: "0.0.0.0"
  port: 8765

# Optional generic resource pack assembled from adapter-provided assets.
resource-pack:
  enabled: true
  public-url: ""
  required: false
  prompt: "&eThis server provides custom assets. Download the resource pack?"
