# UniversalModSync — Paper adapter framework.
# Original Forge/Fabric JARs are inspected for metadata only; Paper cannot execute them.
# Install trusted Paper adapter JARs into plugins/UniversalModSync/adapters/.
# Put mod archives to inspect into plugins/UniversalModSync/mods/.
mods:
  directory: "mods"
adapters:
  directory: "adapters"
http:
  enabled: true
  bind-address: "0.0.0.0"
  port: 8765
resource-pack:
  enabled: true
  public-url: ""
  required: false
  prompt: "&eThis server provides custom assets. Download the resource pack?"
