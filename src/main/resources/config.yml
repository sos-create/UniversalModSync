# This Paper plugin distributes mods to Forge clients.
# It does not load or execute Forge mods on the Paper server.
http:
  enabled: true
  bind-address: 0.0.0.0
  port: 8765

# Files in plugins/UniversalModSync/mods are installed into the player's
# Forge client mods folder by the companion launcher.
mods:
  scan-interval-seconds: 10
  include-unrecognized-jars: false

# Pack metadata sent to the client launcher.
# Use exact versions that the players must install.
pack:
  name: "UniversalModSync Client Pack"
  target: "CLIENT_SINGLEPLAYER"
  loader: "forge"
  minecraft-version: "1.21.4"
  forge-version: "54.1.0"

# Client-only/singleplayer mode means these mods are installed on each player's
# Forge game client. A singleplayer world runs its integrated server inside
# that client. Paper remains only a pack distribution endpoint.
