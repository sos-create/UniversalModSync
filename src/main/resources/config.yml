# HTTP endpoint used by the companion client launcher.
# Do not expose this endpoint to the public internet without HTTPS/authentication.
http:
  enabled: true
  bind-address: 0.0.0.0
  port: 8765

# JAR files placed in plugins/UniversalModSync/mods are detected automatically.
# The folder is scanned in the background; changes appear in the client manifest.
mods:
  scan-interval-seconds: 10

# Paper does NOT load Forge mods. This plugin publishes mod files and metadata
# for a compatible Forge client launcher to install on players' computers.
