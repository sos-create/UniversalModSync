name: UniversalModSync
version: '${version}'
main: com.soscreate.universalmodsync.UniversalModSyncPlugin
api-version: '1.21'
author: sos-create
description: Server-side adventure content with cached custom items and dungeons.
commands:
  modsync:
    description: UniversalModSync gameplay and administration
    usage: /modsync <status|reload|dungeon|boss|give <player> <item>>
    permission: universalmodsync.admin
permissions:
  universalmodsync.admin:
    description: Allows administration of UniversalModSync
    default: op
