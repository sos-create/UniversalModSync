# UniversalModSync is a Paper gameplay plugin.
# It creates server-side items, mobs and dungeons. Players do NOT install mods.
# The optional resource pack is downloaded and cached by Minecraft for this server;
# it is not placed in the mods folder and does not need manual deletion.

http:
  enabled: true
  bind-address: 0.0.0.0
  port: 8765

# Legacy Forge mod manifest support. It is not used for the server-side gameplay
# system and does not make Forge mods run on Paper.
mods:
  scan-interval-seconds: 10
  include-unrecognized-jars: false

pack:
  name: "UniversalModSync Server Adventure Pack"
  target: "PAPER_SERVER"
  loader: "none"
  minecraft-version: "1.21.4"
  forge-version: "not-required"

# Minecraft caches the server resource pack after download.
# Players do not need to delete it after leaving.
# Replace the URL with the public HTTPS URL reachable by your players.
# Example: https://your-domain.example:8765/v1/resource-pack.zip
resource-pack:
  enabled: true
  public-url: ""
  required: false
  prompt: "&eThis server uses custom adventure items and dungeon visuals. Download the server pack?"
