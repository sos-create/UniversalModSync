name: UniversalModSync
version: '${version}'
main: com.soscreate.universalmodsync.UniversalModSyncPlugin
api-version: '1.21'
author: sos-create
description: Mod discovery and Paper adapter compatibility framework.
commands:
  modsync:
    description: UniversalModSync compatibility management
    usage: /modsync <status|scan|mods|reload>
    permission: universalmodsync.admin
permissions:
  universalmodsync.admin:
    description: Allows administration of UniversalModSync
    default: op
